<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scotland Yard</title>
    <meta name="description" content="A Scotland-Yard-style hidden-movement board game — play as detectives hunting a hidden adversary across real-world and fantasy maps." />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      /* NOTE: body no longer has overflow:hidden globally -- that was
         breaking scrolling on every screen (Owner Panel, setup, etc),
         not just the game board it was originally added for. The game
         board's own fixed-viewport layout is scoped to its own
         container (see styles.pagePlaying in GameBoard.jsx), which is
         the correct place for that constraint to live. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
